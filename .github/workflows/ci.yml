name: Build and Push Docker Image

on:
  push:
    branches:
      - master  # Trigger on push to the master branch
  pull_request:
    branches:
      - master  # Trigger on pull requests to the master branch

jobs:
  build:
    runs-on: ubuntu-latest  # Use the latest Ubuntu environment

    steps:
    - name: Checkout code
      uses: actions/checkout@v2  # Checkout the repository's code

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2  # Set up Docker Buildx for better builds

    - name: Log in to Docker Hub
      uses: docker/login-action@v2  # Login to Docker Hub
      with:
        username: ${{ secrets.DOCKER_USERNAME }}  # Add your Docker Hub username to GitHub secrets
        password: ${{ secrets.DOCKER_PASSWORD }}  # Add your Docker Hub password to GitHub secrets

    - name: Build and push Docker image
      uses: docker/build-push-action@v2  # Use Docker's official action to build and push
      with:
        context: .  # Build the Docker image from the root of the repository
        push: true  # Push the image to Docker Hub
        tags: ${{ secrets.DOCKER_USERNAME }}/my-node-app:latest  # Specify the Docker image name and tag

